events {}

http {
    # Qualys CSV exports with the Results column can get large.
    client_max_body_size 200m;
    proxy_read_timeout 180s;

    server {
        listen 38814;
        server_name _;

        location / {
            # Docker's own DNS, re-resolved every 10s: with a literal upstream
            # nginx resolves "web" once at start and keeps answering 502 after a
            # rebuild gives the web container a new address (a variable in
            # proxy_pass is what makes nginx look it up again).
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $upstream http://web:37653;
            proxy_pass $upstream;
            # $http_host keeps the port (e.g. :23847); Django compares it with the
            # browser Origin header on every POST, so dropping it breaks CSRF.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
