name: pvm

services:
  db:
    # Own name for every image of the stack, so `docker images` shows what is PVM's.
    build:
      dockerfile_inline: |
        FROM postgres:16-alpine
    image: pvm-db
    restart: unless-stopped
    command: ["postgres", "-c", "port=5432"]
    # The project folder may sit on a filesystem that refuses chown, so
    # Postgres can run as the folder's owner (PVM_USER, uid:gid). With 0:0
    # the image starts as root, hands data/postgres to its own postgres user
    # and drops privileges.
    user: "${PVM_USER:-1000:1000}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pvm}
      POSTGRES_USER: ${POSTGRES_USER:-pvm}
      # No default: Compose refuses to start without a password in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5432 -U ${POSTGRES_USER:-pvm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    build:
      dockerfile_inline: |
        FROM redis:7-alpine
    image: pvm-redis
    restart: unless-stopped
    command: ["redis-server", "--port", "6379"]
    # Same as db: runs as PVM_USER (with 0:0 the image fixes the owner of
    # data/redis itself), and the dump stays inside the project folder
    # instead of an anonymous volume.
    user: "${PVM_USER:-1000:1000}"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One application image, built here and shared by web, worker, worker-background and beat.
  web:
    build: .
    image: pvm-app
    restart: unless-stopped
    # Migrations run here, once, before gunicorn starts. The worker and
    # beat containers only read/write data, so they do not run migrate.
    command: sh -c "python manage.py migrate --noinput && python manage.py priority_refresh && gunicorn pvm.wsgi:application --bind 0.0.0.0:37653 --workers 3 --timeout 180"
    env_file:
      - .env
    volumes:
      - ./data/scan_imports:/app/scan_imports
      - ./data/backups:/app/backups_data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "37653"

  # What users wait for: imports, a host's patch check (Ubuntu tracker or
  # Rocky errata), the Qualys Csam / Pm searches, "Ask Server" ("celery" queue).
  worker:
    image: pvm-app
    restart: unless-stopped
    command: celery -A pvm worker -Q celery -n interactive@%h -O fair -l info
    env_file:
      - .env
    volumes:
      - ./data/scan_imports:/app/scan_imports
      - ./data/backups:/app/backups_data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Long refreshes (NVD, CISA KEV, EPSS, the nightly patch re-check, the
  # priority recompute, the history snapshot) on their own queue, one at a
  # time, so they never delay the worker above.
  worker-background:
    image: pvm-app
    restart: unless-stopped
    command: celery -A pvm worker -Q background -n background@%h --concurrency=1 -O fair -l info
    env_file:
      - .env
    volumes:
      - ./data/scan_imports:/app/scan_imports
      - ./data/backups:/app/backups_data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: pvm-app
    restart: unless-stopped
    command: celery -A pvm beat -l info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      dockerfile_inline: |
        FROM nginx:alpine
    image: pvm-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # PVM_LISTEN in .env: "23847" listens on every interface of the VM;
      # "127.0.0.1:23847" or "<vm ip>:23847" restricts it to one address.
      - "${PVM_LISTEN:-23847}:38814"
    depends_on:
      - web

