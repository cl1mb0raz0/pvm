{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pvm{% endblock %} · Pvm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="icon" type="image/png" href="{% static 'pvm/img/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'pvm/css/pvm.css' %}">
  <script src="{% static 'pvm/js/htmx.min.js' %}" defer></script>
  <script src="{% static 'pvm/js/multi.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% block body %}{% endblock %}
</body>
</html>
